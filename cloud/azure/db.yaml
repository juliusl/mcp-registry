apiVersion: v1
kind: Service
metadata:
  name: mcpdb
  labels:
    app: mcpdb
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongo
  clusterIP: None
  selector:
    app: mcpdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  selector:
    matchLabels:
      app: mcpdb
  serviceName: "mcpdb"
  template:
    metadata:
      labels:
        app: mcpdb
    spec:
      containers:
      - name: mongodb
        image: protomcp.azurecr.io/mongo:latest
        ports:
        - containerPort: 27017
          name: mongo
        volumeMounts:
        - name: data
          mountPath: /data/db
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: managed-csi
      resources:
        requests:
          storage: 5Gi
